# Runs on every push: does CamGrid still hold together?
name: Tests

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: API tests (no cameras needed)
        run: python test/test_server.py

      - name: Shell scripts - syntax check
        run: |
          for datei in install.sh uninstall.sh netz-installation.sh scripts/*.sh start-lokal.sh; do
            [ -f "$datei" ] || continue
            sh -n "$datei" && echo "ok $datei"
          done

      - name: Installer dry run
        run: sh install.sh --dry-run
